short_bio: >-
 <p>
  I am a PhD student in Digital Transformation and Innovation (DTI) at the University of Ottawa. My research is driven by one question: how do systems built on past information respond to a world that continues to change?
 <p>
  My training in law and finance first exposed this tension. Rules and models are written from what is already known, yet they must govern or predict what has not yet happened. My later work in AI psychology carried the same question into artificial intelligence, where I began treating AI systems as cognitive and behavioral agents whose reasoning can be probed experimentally.
 </p>
 <p>
  My current work applies this lens to large language models. Once trained, an LLM is largely frozen, while the information environment it depends on keeps moving. My research on Generative Engine Optimization (GEO) treats that gap as an experimental lever, asking how an already-trained model responds when the information reaching it is new, contradictory, or deliberately manipulated.
 </p>
