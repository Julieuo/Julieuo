<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row">

                    <!-- Left column: University of Ottawa -->
                    <div class="col-lg-6">
                        <div class="mx-2 my-1">
                            <h6>Education</h6>

                            {% assign item = site.data.profile.education[0] %}
                            <div class="media mb-3">
                                <img src="{{ item.logo | relative_url }}"
                                     alt="{{ item.name }}"
                                     style="width: 28px; height: 28px; object-fit: contain;"
                                     class="mr-2 mt-1">

                                <div class="media-body">
                                    <div class="font-weight-normal">
                                        {{ item.name }}
                                    </div>

                                    <div class="small">
                                        {{ item.dept }}
                                    </div>

                                    <div class="small">
                                        <strong>{{ item.position }}</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>


                    <!-- Right column: CAS + ZUEL -->
                    <div class="col-lg-6">
                        <div class="mx-2 my-1">
                            <h6>Education</h6>

                            {% for item in site.data.profile.education offset:1 %}

                            <div class="media mb-3">
                                <img src="{{ item.logo | relative_url }}"
                                     alt="{{ item.name }}"
                                     style="width: 28px; height: 28px; object-fit: contain;"
                                     class="mr-2 mt-1">

                                <div class="media-body">
                                    <div class="font-weight-normal">
                                        {{ item.name }}
                                    </div>

                                    <div class="small">
                                        {{ item.dept }}
                                    </div>

                                    <div class="small">
                                        <strong>{{ item.position }}</strong>
                                    </div>
                                </div>
                            </div>

                            {% endfor %}
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
